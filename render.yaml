services:
  - type: web
    name: matt-token
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run site
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GIFT_BOX_PUBLIC_QUOTES_ENABLED
        sync: false
      - key: GIFT_BOX_QUOTE_PRIVATE_KEY
        sync: false
