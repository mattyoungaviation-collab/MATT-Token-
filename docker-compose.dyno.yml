services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: dyno
      POSTGRES_PASSWORD: dyno_local_only
      POSTGRES_DB: dyno
    ports: ["5433:5432"]
    volumes: ["dyno-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyno"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dyno-postgres: {}
